## Magic Source\r
\r
Wizard: Büyü akademesine giderek Bard mezunu oldun.\r
\r
Sorcerer: Bard'lık içinden gelen bir şey.\r
\r
Detaylı bilgi için [tıkla.](magic-source.md)\r
\r
\r
\r
## Bard Magic Knowledge\r
\r
Bard'lar Spectromancy magic school'unda proficiency ile başlar. "Bard" tag'li büyüleri daha iyi yapabilirler. Bir tane "Bard" tag'li büyüyü cantrip olarak seç, iki tane herhangi kullanabileceğin ekstra büyü daha seç.\r
\r
\r
\r
## Bardic Inspiration\r
\r
Performansın ile inspiration verirsin. Verdiğin kişiler inspiration'ı istediği zaman inspiration zarı atarak kullanabilir. Aynı anda aktif olarak CHA Mod'un kadar inspiration verebilirsin.\r
\r
Level 1: 1d6\r
\r
Level 5: 1d8\r
\r
Level 10: 1d10\r
\r
Level 15: 1d15\r
\r
Level 20: 1d20\r
\r
\r
\r
## Song of Rest\r
\r
Level 2: Short Rest'lerde şarkı çalarak ekibi ekstra heal'larsın. (Level'ın + CHA Mod'un) tane Bardic Inspiration zarından atarsın, gelen sonucun 10 katı kadar heallanırsınız.\r
\r
\r
\r
## Jack of All Trades\r
\r
Level 2: Proficiency sahibi olmadığın her yetenekte yarı proficiency kazanırsın.\r
\r
\r
\r
## Bonus Proficiency\r
\r
Level 4,8,13: Proficiency sahibi olmadığın yetenekte proficiency kazan yada proficiency sahibi olduğun yetenekte expertise kazan.\r
\r
\r
\r
## Ability Improvement\r
\r
Level 4,8,13: Bu level'larda 3 puan dağıtmak yerine 6 puan dağıtılıyor ama 3 farklı stat'a dağıtmak zorundasın.\r
\r
\r
\r
## Countercharm\r
\r
Level 5: Performans gerçekleştirerek Bardic Inspiration taşıyan istediğin kişilerin 1 mental debuff'ını kaldırabilirsin, Bardic Inspiration'larını harcar.\r
\r
Level 10: Performans gerçekleştirerek Bardic Inspiration taşıyan istediğin kişilerin her debuff'ını kaldırabilirsin, Bardic Inspiration'larını harcar.\r
\r
Level 15: Performans gerçekleştirerek Bardic Inspiration taşıyan istediğin kişilerin her debuff'ını kaldırabilirsin.\r
\r
Level 20: Performans gerçekleştirerek istediğin kişilerin her debuff'ını kaldırabilirsin.\r
\r
\r

#### Unsettling Words\r
Rakibe kendinden şüphe edecek sözler söylersin. Bardic Inspiration zarı atarsın ve rakip bu etkinin altında olduğu sürece her zarına o zar sonucu kadar - alır.\r
\r
#### Mantle of Inspiration\r
(Level'ın + CHA Mod'un) tane Bardic Inspiration zarından atarsın, gelen sonucun 10 katı kadar heal'ı istediğin şekilde dağıtırsın. Heal'ladığın kişiler isterse Reaction AP harcayarak 1 movement AP kadar hareket edebilir.\r
\r
#### Unfailing Inspiration\r
Bardic Inspiration verdiğin birinin zarı yinede fail'larsa inspiration'ı kaybetmek yerine tutabilir. Bardic Inspiration verdiğin biri inspiration'ı kullanıp başarılı olduğu zaman ise Reaction kullanarak başka birine inspiration verebilirsin (Inspiration harcamadan).\r
\r

#### Silver Tongue\r
Persuasion veya Deception zar sonucunu beğenmezsen 10'a çevirebilirsin.\r
\r
#### Enthralling Performance\r
1 dakikalık şov yaparak CHA Mod kadar kişiyi charm'lamayı deneyebilirsin (WIS Save). Charm süresi 1 saat sürer. Sen veya senin dostların tarafından hasar alırsa tekrar WIS save atabilir. İkinciye aynı şekilde hasar alırsa WIS save atmaya gerek olmadan etkiden kurtulur.\r
\r
#### Universal Speech\r
1 saat boyunca CHA Mod kadar yaratık seçersin, büyülü şekilde sen onları onlarda seni anlamaya başlar.\r
\r
#### Mantle of Majesty\r
1 dakikalık şov yaparak kendini cazibe edici bir büyü ile kaplarsın. Sana bakanlar sana hizmet etmek ister. Bu büyü ile kaplı iken "Command" yeteneği kullanabilirsin (WIS Save). Charmlı kişiler otomatik WIS Save'lerini fail'lar.\r
\r
#### Unbreakable Majesty\r
1 dakika süren bir büyü ile kaplanırsın. Sana birisi saldırmayı denediği zaman CHA save dener, başarısız olursa donup kalır ve saldırısı boşa gider. Eğer başarılı olursa saldırısı dezavantajlı olur.\r

## Magic Source\r
\r
Wizard: Büyü akademesine giderek Druid mezunu oldun.\r
\r
Sorcerer: Druid'lik içinden gelen bir şey.\r
\r
Detaylı bilgi için [tıkla.](magic-source.md)\r
\r
\r
\r
## Druid Magic Knowledge\r
\r
Druid'ler Vitamancy magic school'unda proficiency ile başlar. "Druid" tag'li büyüleri daha iyi yapabilirler. Bir tane "Druid" tag'li büyüyü cantrip olarak seç, iki tane herhangi kullanabileceğin ekstra büyü daha seç.\r
\r
\r
\r
## Lifeweave\r
\r
Performansın ile inspiration verirsin. Verdiğin kişiler inspiration'ı istediği zaman inspiration zarı atarak kullanabilir. Aynı anda aktif olarak CHA Mod'un kadar inspiration verebilirsin.\r
Yaşam dokusuna erişimin var. \r
\r
Level 1: 1d6\r
\r
Level 5: 1d8\r
\r
Level 10: 1d10\r
\r
Level 15: 1d15\r
\r
Level 20: 1d20\r
\r
\r
\r
## Song of Rest??\r
\r
Level 2: Short Rest'lerde şarkı çalarak ekibi ekstra heal'larsın. (Level'ın + CHA Mod'un) tane Bardic Inspiration zarından atarsın, gelen sonucun 10 katı kadar heallanırsınız.\r
\r
\r
\r
## Jack of All Trades??\r
\r
Level 2: Proficiency sahibi olmadığın her yetenekte yarı proficiency kazanırsın.\r
\r
\r
\r
## Bonus Proficiency??\r
\r
Level 4,8,13: Proficiency sahibi olmadığın yetenekte proficiency kazan yada proficiency sahibi olduğun yetenekte expertise kazan.\r
\r
\r
\r
## Ability Improvement??\r
\r
Level 4,8,13: Bu level'larda 3 puan dağıtmak yerine 6 puan dağıtılıyor ama 3 farklı stat'a dağıtmak zorundasın.\r
\r
\r
\r
## Nature's Sanctuary\r
\r
Level 5: Ruhani bağın olan birisi düşmüş durumda iken Lifeweave harcayarak 1 fail azaltıp 1 success arttırırsın. (fail yoksa 2 success arttırırsın). Bu sayede kalkarsa (Level'ın + WIS Mod'un) tane Lifeweave zarı atıp o kadar can yeniler.\r
\r
Level 10: Ruhani bağın olan birisi düşmüş durumda iken 2 Lifeweave harcayarak onu yerin içine çekersin. Bu durumda iken Lifeweave harcayarak 1 fail azaltıp 1 success arttırırsın. (fail yoksa 2 success arttırırsın). Bu sayede kalkarsa (Level'ın + WIS Mod'un) tane Lifeweave zarı atıp o kadar can yeniler.\r
\r
Level 15: Ruhani bağın olan birisi düşmüş durumda iken 2 Lifeweave harcayarak onu yerin içine çekersin. Bu durumda iken Death Save Throw'ları auto success sayılır. Bu sayede kalkarsa (Level'ın + WIS Mod'un) tane Lifeweave zarı atıp o kadar can yeniler.\r
\r
Level 20: Ruhani bağın olan birisi düşmüş durumda iken 3 Lifeweave harcayarak onu direk kaldırabilirsin. Bu sayede kalkarsa (Level'ın + WIS Mod'un) tane Lifeweave zarı atıp o kadar can yeniler.\r

## Proficiency\r
Bazı karakterler bazı şeylerde ustalık veya uzmanlık gösterebilir. Örneğin stealth becerisinde ustalığı olan birisi, stealth check atması gerektiği durumda zarına ustalık bonusu alır. Zaten ustalık sahibi iken ustalık kazanmak, onu uzmanlığa çevirir. Uzmanlık bonusu, ustalık bonusunun iki katıdır.\r
\r
## Ability Checks\r
Bazı durumlarda yetenek check atmanız gerekebilir. Yetenek check istendiği zaman hangi yetenek olduğu belirtilir. /1d20'lik zar atarak üstüne belirtilen yetenek modifier'ınız ve ustalık bonuslarınız eklenir. Zar sonucunun 1 gelmesi kritik ıska, 20 gelmesi ise kritik başarı sayılır. Harici sonuçlar ise check için belirlenen DC (Difficulty Class)'i geçerse başarılı sayılır.\r
### Competing Check\r
Yetenek check bir rakibe karşı yapılıyorsa DC yerine rakibin kurtarma zarını (Saving Throw) geçmek gerekir.\r
### Advantage/Disadvantage\r
Bazen yetenek check'inize avantaj veya dezavantaj eklenebilir. Avantaj durumunda bir zar atmak yerine iki zar atılır ve yüksek olan kabul edilirken dezavantaj durumunda düşük olan kabul edilir.\r
### Saving Throw\r
Sana karşı atılan bir yetenek check'ine karşı atılarak eylemi zayıflatmak veya durdurmak için atılır. Kurtarma zarlarında ustalık bonusu varsa eklenir.\r
### Attack Roll\r
Saldırı denemesi de bir yetenek check çeşididir. Saldırı türünüze göre yetenek check'inin hangi yetenekle olacağı değişir, DC yerine ise rakibin AC (Armor Class) değerini geçmek gerekmektedir.\r
\r
## Passive Checks\r
Bazı durumlarda DM oyunculara zar attırmak yerine pasif değer kullanabilir. Örneğin odada görünmez bir yaratık var, böyle bir durumda oyunculardan farkındalık zarı istemek şüpheli olacağından bu tarz durumlarda farkındalık zarı istemek yerine DM pasif farkındalık değerlerini kullanır. Pasif farkındalık değeri zar sonucu 10 gelmiş gibi üstüne modifier'lar eklenerek elde edilir.\r
\r
## Working Together\r
Bir eylemi gerçekleştirirken yardım alıyorsan, eyleme yardım eden herkes 1d20 sini atar. En yüksek sonuca, yardım edenler arasındaki en yüksek modifier'lı kişinin modifier'ı eklenir.\r
\r

DEX check ile her karakterin savaş sıralamasında ki konumu belirlenir.\r
Ambush: Savaşa hazırlıksız yakalanan karakterler initiative zarına dezavantaj alır.\r
\r
## Ending Combat\r
Geriye savaşabilecek tek bir taraf kalınca savaş sonlanır. Karakterlerin savaşamayacak duruma düşmesi için: ölmesi, bayılması, teslim olması veya kaçmış olması gerekir.\r
\r
## Cover\r
Cover arkasında saklanmak, vurulmayı zorlaştırır. Yarı cover, +2 AC. Büyük cover, +5 AC. Tam cover ise hedeflenmeyi engeller.\r
\r
## Hit\r
Saldırı zarlarında zar sonucu maksimum değer gelirse kritik hasar (aksi yazmadığı sürece 2 kat hasar), zar sonucu minimum değer gelirse otomatik ıskadır.\r
\r
## HP\r
Bir karakterin canı, ırkının base HP değerine, CON Modifier'ına, level'ına ve sahip olduğu eşyalar/özelliklere bağlıdır.\r
\r
### Healing\r
Can doldurma yolları: Büyü, İksir ve Dinlenmektir. Can, maximum canı geçemez.\r
\r
### Armor\r
Bir karakterin Armor'u varken hasar önce armordan azaltılır.\r
\r
### Death\r
Canı 0'a düşen karakterler "ölüm eşiğinde" durumuna gelir. Bu durumda iken her tur death saving throw atılır. 3 başarılı yada 3 başarısız olunca durum sona erer. Can 0'a düştüğünde artan hasarın miktarına göre karakter bir kaç başarısız death saving throw ile başlayabilir. 3 başarısız: ölüm. 3 başarılı: geri kalkar. Canı 0'a düşen birini öldürmek yerine bayıltmayı seçerek bayıltılabilir, uyanınca short rest etkisi alır. ölüm eşiğindeki biri başkası tarafından kaldırılabilir.\r
\r
## Rest\r
Dinlenme çeşitleri aşağıdaki gibidir.\r
\r
### Short Rest\r
1 saat sürer. Yemek yiyip hafif dinlenme sonucu yapılabilir. %(1d20+20) kadar heal verir.\r
\r
### Long Rest\r
8 saat uyku. %100 heal.`,kN=Object.freeze(Object.defineProperty({__proto__:null,default:TN},Symbol.toStringTag,{value:"Module"})),AN="",SN=Object.freeze(Object.defineProperty({__proto__:null,default:AN},Symbol.toStringTag,{value:"Module"})),_N="",CN=Object.freeze(Object.defineProperty({__proto__:null,default:_N},Symbol.toStringTag,{value:"Module"})),vN=`<table class="tableRow">

Karakter yapmanın ilk adımı ırk seçmektir. Irk ve alt ırk seçimi karakterinin ömrünü, base hp'sini, başlangıç bonuslarını ve pasif özelliklerini belirler. Ayrıca bazı ırklar, bazı bölgelerde veya bazı diğer ırkların gözünde "düşük" ırk olarak görülebilir ve sosyal zorluklara yol açabilir.\r
Daha ayrıntılı ırk detayları için "General Rules" kitabını inceleyebilirsiniz.\r
\r
## 2. Chosing a Class\r
Karakter yapmanın ikinci adımı sınıf seçmektir. Her sınıfın yatkın olduğu yetenekler, tercih ettikleri silahlar, büyü erişimleri vb. değişiklik göstermektedir ve başka sınıflar tarafından elde edilemeyen bazı özelliklere sahiptirler. Çoklu sınıf yapmak mümkündür.\r
Daha ayrıntılı sınıf detayları için "General Rules" kitabını inceleyebilirsiniz.\r
\r
## 3. Determining Ability Scores\r
Irk ve sınıf seçiminden sonra sıra başlangıç yetenek puanlarını dağıtmada. Her karakterin fiziksel ve zihinsel yetenekleri 8 ile başlar, ve dağıtılabilir 20 puanı olur. Bu evrede bir yetenek 15'i geçemez (ırk veya sınıf bonusları ile geçebilir).\r
Daha ayrıntılı yetenek ve beceri detayları için "General Rules" kitabını inceleyebilirsiniz.\r
\r
## 4. Describing Your Character\r
Karakterinin hikaye başlangıcında nasıl bir şey olacağı artık belli. Şimdi karakterinin hikayeye dahil olmadan önce neler yaptığı, nerden geldiği, adının ne olduğu, amacı, moral pusulası, idealleri, kusurları, bağları gibi detaylar yazılır. Bu aşamada ayrıca GM'e danışarak ekstra ırk avantajı, ekstra sınıf avantajı, ekstra yetenek puanı, ekstra özellik, ekstra başlangıç eşyaları gibi şeyler için pazarlık yapılabilir.\r
\r
## 5. Come Together\r
Karakterin artık hazır, sıradaki adım kalan oyuncuların karakterleri ile bir araya gelmek. Diğer oyunculara danışarak hikayeden önce tanışık olabilirsiniz, akraba olabilirsiniz, düşman olabilirsiniz veya hiç tanışmamış olabilirsiniz. Karakterleri bir araya getirecek ve hikayeyi başlatacak olay, session 0 ile gerçekleşir.`,RN=Object.freeze(Object.defineProperty({__proto__:null,default:ON},Symbol.toStringTag,{value:"Module"})),LN=`ufak main ırk tanıtımı\r
