## The Golden Children of Dawn

**Pronunciation:** SOOL-elvs  
**Alternative Names:** Gold Elves, Solar Elves  
**Homeland:** The Crystal Spires of Luminara Prime

---

### Description

Sun Elves are the most regal and aristocratic of all High Elves. Their skin shimmers with a golden hue, and their hair ranges from pale blonde to brilliant gold. They are the ancient rulers of the floating cities.

---

### Sun Elf Traits

**Ability Score Increase:** +1 Charisma  
**Golden Resistance:** Resistance to radiant damage  
**Solar Affinity:** Your cantrips and spells that deal radiant damage deal extra damage equal to your proficiency bonus  
**Noble Bearing:** Proficiency in Persuasion skill  
**Sunlight Vision:** You have advantage on Perception checks made in sunlight

---

### Culture

**Government:** Monarchy (The Solar Throne)  
**Religion:** Worship **Lathander**, the Morning Lord  
**Values:** Perfection, Tradition, Magic, Nobility  
**Arts:** Architecture, Poetry, High Magic, Celestial Art

---

### Notable Sun Elf Figures

| Name | Title | Domain |
|------|-------|--------|
| **Elion Starfire** | Sun King | Ruler of Luminara |
| **Lyria Goldensong** | High Priestess | Temple of Lathander |
| **Theron Lightweaver** | Archmage | Arcane Academy |
`},B0={id:"moon-elves",title:"Moon Elves",content:`# Moon Elves (Silver Elves)

## The Silver Children of Twilight

**Pronunciation:** MOON-elvs  
**Alternative Names:** Silver Elves, Lunar Elves  
**Homeland:** The Moonlit Towers of Selune

---

### Description

Moon Elves are the more whimsical and adventurous cousins of the Sun Elves. They have silvery skin and hair of silver or pale blue, and they are deeply connected to the magic of the night.

---

### Moon Elf Traits

**Ability Score Increase:** +1 Wisdom  
**Lunar Resistance:** Resistance to cold damage  
**Moon Affinity:** Your spells that deal cold or psychic damage deal extra damage equal to half your proficiency bonus  
**Silver Tongue:** Proficiency in Deception skill  
**Moonlight Step:** As a bonus action, you can teleport up to 30 feet to an unoccupied space you can see (recharges after long rest)

---

### Culture

**Government:** Council of Elders  
**Religion:** Worship **Selune**, the Moon Mother  
**Values:** Freedom, Mystery, Exploration, Art  
**Arts:** Music, Illusion Magic, Astrology, Storytelling

---

### Notable Moon Elf Figures

| Name | Title | Domain |
|------|-------|--------|
| **Sylara Moonshadow** | Moon Priestess | Keeper of the Lunar Gates |
| **Kael Nightwhisper** | Spymaster | The Hidden Hand |
| **Elara Starweaver** | Prophetess | The Celestial Watcher |
`},q0={id:"high-elves",title:"High Elves",content:`# High Elves

## The Noble Children of the Sun and Moon

High Elves are the most refined and magical of all elven kind. They hail from the great floating cities of Luminara and consider themselves the purest expression of elven heritage.

---

### High Elf Traits

**Ability Score Increase:** +1 Intelligence  
**Cantrip:** Learn one Wizard cantrip of your choice  
**Elf Weapon Training:** Proficiency with longswords, shortswords, longbows, and shortbows  
**High Elf Magic:** Extra spell known at 3rd level  
**Languages:** Two extra languages of your choice

---

## High Elf Subtypes

High Elves are further divided into two noble houses:
`,subChapters:[j0,B0]},Y0={id:"wood-elves",title:"Wood Elves",content:`# Wood Elves (Green Elves)

## The Protectors of the Ancient Forests

**Pronunciation:** WOOD-elvs  
**Alternative Names:** Green Elves, Forest Elves  
**Homeland:** The Verdant Canopy of Eldergrove

---

### Description

Wood Elves are the wild and untamed protectors of the ancient forests. They have copper or bronze skin and hair of brown, green, or autumn colors. They are deeply connected to nature.

---

### Wood Elf Traits

**Ability Score Increase:** +1 Constitution  
**Fleet of Foot:** Base walking speed increases to 35 feet  
**Mask of the Wild:** Can attempt to hide even when only lightly obscured by foliage, heavy rain, falling snow, mist, and other natural phenomena  
**Forest Affinity:** Advantage on Nature checks related to forests  
**Elf Weapon Training:** Proficiency with longswords, shortswords, longbows, and shortbows

---

### Culture

**Government:** Tribal Chieftains  
**Religion:** Worship **Mielikki**, the Forest Queen  
**Values:** Harmony with Nature, Freedom, Protection of the Wild  
**Arts:** Woodcarving, Herbalism, Nature Magic, Hunting

---

### Notable Wood Elf Figures

| Name | Title | Domain |
|------|-------|--------|
| **Thorn Greenbough** | Forest Lord | Guardian of Eldergrove |
| **Willow Whisperwind** | Healer | The Green Sanctuary |
| **Hawk Strongbow** | Hunter | The Stalking Shadows |
`},G0={id:"dark-elves",title:"Dark Elves (Drow)",content:`# Dark Elves (Drow)

## The Shadow Children of the Underworld

**Pronunciation:** DROW  
**Alternative Names:** Dark Elves, Shadow Elves  
**Homeland:** The Underdark Cities of Menzoberra

---

### Description

Dark Elves, known as Drow, are the mysterious elves who dwell deep beneath the earth. They have obsidian black skin and hair of white or silver, and their eyes glow with inner light.

---

### Dark Elf Traits

**Ability Score Increase:** +1 Charisma  
**Superior Darkvision:** 120 feet  
**Sunlight Sensitivity:** Disadvantage on attack rolls and Perception checks in sunlight  
**Drow Magic:** Know the Dancing Lights cantrip; Faerie Fire at 3rd level; Darkness at 5th level  
**Elf Weapon Training:** Proficiency with rapiers, shortswords, and hand crossbows

---

### Culture

**Government:** Matriarchal Theocracy  
**Religion:** Worship **Lolth**, the Spider Queen  
**Values:** Power, Cunning, Survival, Ambition  
**Arts:** Poisoncraft, Shadow Magic, Spider Silk Weaving, Assassination

---

### Notable Dark Elf Figures

| Name | Title | Domain |
|------|-------|--------|
| **Malice Spiderqueen** | High Priestess | The Black Cathedral |
| **Vhaeraun Shadowstrike** | Assassin Lord | The Silent Killers |
| **Liriel Baenre** | Rogue Mage | The Arcane Shadows |
`},X0={id:"elves",title:"Elves",subtitle:"The Immortal Children of Light",content:`# Elves of Eldoria

## Overview

Elves are the ancient, immortal race that once ruled the lands of Eldoria. They are divided into several sub-races, each with their own unique cultures, traditions, and abilities.

---

### Common Elven Traits

**Ability Score Increase:** +2 Dexterity  
**Age:** Elves can live to be over 750 years old  
**Alignment:** Chaotic Good  
**Size:** Medium (5-6+ feet tall)  
**Speed:** 30 feet  
**Darkvision:** 60 feet  
**Fey Ancestry:** Advantage on saving throws against being charmed  
**Trance:** Elves don't sleep - they meditate for 4 hours daily  
**Languages:** Common, Elvish, and one extra language

---

## Elven Sub-Races
`,subChapters:[q0,Y0,G0]},w0={id:"mountain-dwarves",title:"Mountain Dwarves",content:`# Mountain Dwarves

**Ability Score Increase:** +2 Constitution, +2 Strength

## Traits
- **Darkvision:** See in dim light within 60 feet as if it were bright light
- **Dwarven Resilience:** Advantage on saving throws against poison
- **Dwarven Combat Training:** Proficiency with battleaxe, handaxe, warhammer
- **Tool Proficiency:** Proficiency with artisan's tools of your choice
- **Stonecunning:** Add double proficiency bonus to Intelligence (History) checks related to stonework
- **Dwarven Armor Training:** Proficiency with light and medium armor

## Description
Mountain Dwarves are stout, hardy folk who dwell in vast underground kingdoms carved from the living rock. They are renowned as master craftsmen, fierce warriors, and keepers of ancient grudges.

Their halls echo with the ring of hammers on anvils, where they forge weapons and armor of unparalleled quality. Mountain Dwarves value honor, clan, and tradition above all else.`},L0={id:"humans",title:"Humans",content:`# Humans

**Ability Score Increase:** +1 to all ability scores

## Traits
- **Versatile:** Gain proficiency in one skill of your choice
- **Bonus Feat:** Gain one feat of your choice at 1st level
- **Extra Language:** You can speak, read, and write one extra language
- **Ambitious:** Humans are driven to achieve greatness in their short lifespans

## Description
Humans are the most adaptable and ambitious people among the common races. They have widely varying tastes, morals, and customs in the many different lands where they have settled.

With their penchant for migration and conquest, humans are more physically diverse than other common races. Their ambition and drive make them capable of achieving greatness in any field they pursue, from magic to warfare to commerce.

Humans live shorter lives than many other races, which drives them to accomplish as much as they can in the years they are given.`},Q0={id:"elemental-dragonborn",title:"Elemental Dragonborn",content:`# Elemental Dragonborn



## hmm

| Name | Title | Domain |
|------|-------|--------|
| **Malice Spiderqueen** | High Priestess | The Black Cathedral |
| **Vhaeraun Shadowstrike** | Assassin Lord | The Silent Killers |
| **Liriel Baenre** | Rogue Mage | The Arcane Shadows |
`},Z0={id:"dragonborn",title:"Dragonborn",subChapters:[Q0],content:`# Kinships of the Realm

The world is home to many ancient races, each with their own heritage and destiny. Choose your kinship wisely, for it shapes not only your physical form but your very soul.

## Available Kinships
- **Elves** (with sub-races: High Elves, Wood Elves, Dark Elves)
  - *High Elves* (with subtypes: Sun Elves, Moon Elves)
- Mountain Dwarves
- Humans

Each kinship grants unique abilities and cultural traditions passed down through the ages.`},V0={id:"kinships",title:"Kinships",subtitle:"Races of the Realm",icon:"⚔️",content:`# Kinships of the Realm

The world is home to many ancient races, each with their own heritage and destiny. Choose your kinship wisely, for it shapes not only your physical form but your very soul.

## Available Kinships
- **Elves** (with sub-races: High Elves, Wood Elves, Dark Elves)
  - *High Elves* (with subtypes: Sun Elves, Moon Elves)
- Mountain Dwarves
- Humans

Each kinship grants unique abilities and cultural traditions passed down through the ages.`,subChapters:[X0,w0,L0,Z0]},K0={id:"vanguard",title:"The Vanguard",content:`# The Vanguard

**Hit Die:** d10  
**Primary Ability:** Strength or Dexterity  
**Armor Proficiency:** All armor and shields  
**Weapon Proficiency:** Simple and martial weapons

## Class Features

### Level 1: Fighting Style
Choose a fighting style that suits your combat approach:
- **Defense:** +1 AC while wearing armor
- **Dueling:** +2 damage when wielding a one-handed weapon
- **Great Weapon Fighting:** Reroll 1s and 2s on damage dice
- **Protection:** Impose disadvantage on attacks against allies within 5 feet

### Level 1: Second Wind
Recover hit points equal to 1d10 + your level as a bonus action. Recharges on short rest.

### Level 2: Action Surge
Take an additional action on your turn once per rest.

### Level 3: Martial Archetype
Choose your specialization:
- **Champion:** Critical hits on 19-20
- **Battle Master:** Learn combat maneuvers
- **Eldritch Knight:** Combine martial prowess with magic

## Description
Vanguards are masters of martial combat, skilled with a variety of weapons and armor. They stand at the front lines, protecting their allies and crushing their foes with superior combat prowess.`},J0={id:"arcanist",title:"The Arcanist",content:`# The Arcanist

**Hit Die:** d6  
**Primary Ability:** Intelligence  
**Armor Proficiency:** None  
**Weapon Proficiency:** Daggers, darts, slings, quarterstaffs, light crossbows

## Class Features

### Level 1: Spellcasting
You can cast wizard spells using Intelligence as your spellcasting ability.
- **Cantrips:** Know 3 cantrips at 1st level
- **Spell Slots:** Follow the Arcanist spell slot progression
- **Spellbook:** Start with 6 first-level spells, learn 2 new spells per level

### Level 1: Arcane Recovery
Once per day during a short rest, recover spell slots up to half your level (rounded up).

### Level 2: Arcane Tradition
Choose your school of magic:
- **School of Evocation:** Master of destructive magic
- **School of Abjuration:** Specialist in protective wards
- **School of Illusion:** Weaver of illusions and deceptions

### Spellcasting Focus
You can use an arcane focus to cast your spells.

## Description
Arcanists are scholars of the arcane arts, wielding reality-bending magic through careful study and practice. They manipulate the raw forces of magic to devastating effect, though their bodies remain frail.`},k0={id:"stalker",title:"The Stalker",content:`# The Stalker

**Hit Die:** d8  
**Primary Ability:** Dexterity  
**Armor Proficiency:** Light armor  
**Weapon Proficiency:** Simple weapons, hand crossbows, longswords, rapiers, shortswords

## Class Features

### Level 1: Expertise
Choose two skills. Double your proficiency bonus for those skills.

### Level 1: Sneak Attack
Once per turn, deal extra damage (1d6 at level 1, increases with level) when you have advantage or an ally is within 5 feet of your target.

### Level 1: Thieves' Cant
You know the secret language of rogues and criminals.

### Level 2: Cunning Action
Use a bonus action to Dash, Disengage, or Hide.

### Level 3: Roguish Archetype
Choose your specialty:
- **Assassin:** Master of deadly first strikes
- **Thief:** Expert at infiltration and sleight of hand
- **Arcane Trickster:** Blend magic with roguery

## Description
Stalkers rely on stealth, precision, and cunning rather than brute force. They strike from the shadows, exploiting weaknesses and avoiding direct confrontation. Masters of skills and subterfuge, they excel at scouting, infiltration, and delivering devastating surprise attacks.`},W0={id:"vocations",title:"Vocations",subtitle:"Classes & Professions",icon:"🛡️",content:`# Vocations

A character's vocation represents their calling, their path of power and expertise. Whether you swing a blade, weave arcane magic, or strike from the shadows, your vocation defines your role in the party.

## Available Vocations
- The Vanguard (Warrior)
- The Arcanist (Mage)
- The Stalker (Rogue)

Each vocation offers unique abilities, playstyles, and progression paths.`,subChapters:[K0,J0,k0]},F0={id:"evocation",title:"Evocation Spells",content:`# Evocation Spells

Evocation spells manipulate magical energy to create powerful effects, usually of a destructive nature.

---

## Fireball
**Level:** 3rd  
**Casting Time:** 1 action  
**Range:** 150 feet  
**Components:** V, S, M (a tiny ball of bat guano and sulfur)  
**Duration:** Instantaneous

A bright streak flashes from your pointing finger to a point you choose within range and then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius sphere centered on that point must make a Dexterity saving throw. A target takes 8d6 fire damage on a failed save, or half as much damage on a successful one.

**At Higher Levels:** When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.

---

## Magic Missile
**Level:** 1st  
**Casting Time:** 1 action  
**Range:** 120 feet  
**Components:** V, S  
**Duration:** Instantaneous

You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4 + 1 force damage to its target. The darts all strike simultaneously.

**At Higher Levels:** When you cast this spell using a spell slot of 2nd level or higher, the spell creates one more dart for each slot level above 1st.

---

## Lightning Bolt
**Level:** 3rd  
**Casting Time:** 1 action  
**Range:** Self (100-foot line)  
**Components:** V, S, M (a bit of fur and a rod of amber, crystal, or glass)  
**Duration:** Instantaneous

A stroke of lightning forming a line 100 feet long and 5 feet wide blasts out from you in a direction you choose. Each creature in the line must make a Dexterity saving throw. A creature takes 8d6 lightning damage on a failed save, or half as much damage on a successful one.

**At Higher Levels:** When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.`},$0={id:"abjuration",title:"Abjuration Spells",content:`# Abjuration Spells

Abjuration spells are protective in nature, creating barriers and wards against harm.

---

## Shield
**Level:** 1st  
**Casting Time:** 1 reaction (when hit by an attack)  
**Range:** Self  
**Components:** V, S  
**Duration:** 1 round

An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack.

---

## Counterspell
**Level:** 3rd  
**Casting Time:** 1 reaction (when you see a creature within 60 feet casting a spell)  
**Range:** 60 feet  
**Components:** S  
**Duration:** Instantaneous

You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a success, the creature's spell fails and has no effect.

**At Higher Levels:** When you cast this spell using a spell slot of 4th level or higher, the interrupted spell has no effect if its level is less than or equal to the level of the spell slot you used.

---

## Mage Armor
**Level:** 1st  
**Casting Time:** 1 action  
**Range:** Touch  
**Components:** V, S, M (a piece of cured leather)  
**Duration:** 8 hours

You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier.`},I0={id:"illusion",title:"Illusion Spells",content:`# Illusion Spells

Illusion spells deceive the senses or minds of others, creating false images or making things invisible.

---

## Invisibility
**Level:** 2nd  
**Casting Time:** 1 action  
**Range:** Touch  
**Components:** V, S, M (an eyelash encased in gum arabic)  
**Duration:** Concentration, up to 1 hour

A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person. The spell ends for a target that attacks or casts a spell.

**At Higher Levels:** When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd.

---

## Mirror Image
**Level:** 2nd  
**Casting Time:** 1 action  
**Range:** Self  
**Components:** V, S  
**Duration:** 1 minute

Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions. Each time a creature targets you with an attack, roll a d20 to determine whether the attack instead targets one of your duplicates. With three duplicates, you must roll a 6 or higher to change the target to a duplicate. A duplicate's AC equals 10 + your Dexterity modifier. If an attack hits a duplicate, the duplicate is destroyed.

---

## Silent Image
**Level:** 1st  
**Casting Time:** 1 action  
**Range:** 60 feet  
**Components:** V, S, M (a bit of fleece)  
**Duration:** Concentration, up to 10 minutes

You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects.

You can use your action to cause the image to move to any spot within range. As the image changes location, you can alter its appearance.`},P0={id:"spells",title:"Sorcery & Spells",subtitle:"Arcane Grimoire",icon:"✨",content:`# Sorcery & Spells

Magic permeates the world, and those who study its secrets can bend reality to their will. This chapter contains the spells available to practitioners of the arcane arts.

## Spell Schools
- Evocation: Destructive elemental magic
- Abjuration: Protective wards and barriers
- Illusion: Deception and manipulation of senses

## Casting Spells
Each spell has specific components, casting time, and effects. Consult your class to determine which spells you can learn.`,subChapters:[F0,$0,I0]},tv={id:"undead",title:"Undead Creatures",content:`# Undead Creatures

Undead are once-living creatures brought to a horrifying state of undeath through necromantic magic or curses.

---

## Skeleton
**Armor Class:** 13 (armor scraps)  
**Hit Points:** 13 (2d8 + 4)  
**Speed:** 30 ft.

**STR** 10 (+0) | **DEX** 14 (+2) | **CON** 15 (+2) | **INT** 6 (-2) | **WIS** 8 (-1) | **CHA** 5 (-3)

**Vulnerabilities:** Bludgeoning  
**Immunities:** Poison, exhaustion  
**Senses:** Darkvision 60 ft., passive Perception 9  
**Languages:** Understands all languages it knew in life but can't speak  
**Challenge:** 1/4 (50 XP)

### Actions
**Shortsword.** *Melee Weapon Attack:* +4 to hit, reach 5 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.

**Shortbow.** *Ranged Weapon Attack:* +4 to hit, range 80/320 ft., one target. *Hit:* 5 (1d6 + 2) piercing damage.

---

## Zombie
**Armor Class:** 8  
**Hit Points:** 22 (3d8 + 9)  
**Speed:** 20 ft.

**STR** 13 (+1) | **DEX** 6 (-2) | **CON** 16 (+3) | **INT** 3 (-4) | **WIS** 6 (-2) | **CHA** 5 (-3)

**Saving Throws:** Wis +0  
**Immunities:** Poison  
**Senses:** Darkvision 60 ft., passive Perception 8  
**Languages:** Understands languages it knew in life but can't speak  
**Challenge:** 1/4 (50 XP)

### Traits
**Undead Fortitude.** If damage reduces the zombie to 0 hit points, it must make a Constitution saving throw with a DC of 5 + the damage taken, unless the damage is radiant or from a critical hit. On a success, the zombie drops to 1 hit point instead.

### Actions
**Slam.** *Melee Weapon Attack:* +3 to hit, reach 5 ft., one target. *Hit:* 4 (1d6 + 1) bludgeoning damage.

---

## Vampire Spawn
**Armor Class:** 15 (natural armor)  
**Hit Points:** 82 (11d8 + 33)  
**Speed:** 30 ft.

**STR** 16 (+3) | **DEX** 16 (+3) | **CON** 16 (+3) | **INT** 11 (+0) | **WIS** 10 (+0) | **CHA** 12 (+1)

**Saving Throws:** Dex +6, Wis +3  
**Skills:** Perception +3, Stealth +6  
**Resistances:** Necrotic; bludgeoning, piercing, and slashing from nonmagical attacks  
**Senses:** Darkvision 60 ft., passive Perception 13  
**Languages:** The languages it knew in life  
**Challenge:** 5 (1,800 XP)

### Traits
**Regeneration.** The vampire regains 10 hit points at the start of its turn if it has at least 1 hit point and isn't in sunlight or running water.

**Spider Climb.** The vampire can climb difficult surfaces, including upside down on ceilings, without needing to make an ability check.

**Vampire Weaknesses.** The vampire has the following flaws:
- *Stake to the Heart.* Reduced to 0 hit points if a piercing weapon made of wood is driven into its heart while it is incapacitated.
- *Sunlight Hypersensitivity.* Takes 20 radiant damage when it starts its turn in sunlight.

### Actions
**Multiattack.** The vampire makes two attacks, only one of which can be a bite attack.

**Claws.** *Melee Weapon Attack:* +6 to hit, reach 5 ft., one creature. *Hit:* 8 (2d4 + 3) slashing damage.

**Bite.** *Melee Weapon Attack:* +6 to hit, reach 5 ft., one willing creature, or a creature that is grappled by the vampire, incapacitated, or restrained. *Hit:* 6 (1d6 + 3) piercing damage plus 7 (2d6) necrotic damage. The target's hit point maximum is reduced by an amount equal to the necrotic damage taken.`},ev={id:"dragons",title:"Dragons & Draconic Beasts",content:`# Dragons & Draconic Beasts

Dragons are legendary creatures of immense power, greed, and ego. They are among the most fearsome adversaries adventurers can face.

---

## Young Red Dragon
**Armor Class:** 18 (natural armor)  
**Hit Points:** 178 (17d10 + 85)  
**Speed:** 40 ft., climb 40 ft., fly 80 ft.

**STR** 23 (+6) | **DEX** 10 (+0) | **CON** 21 (+5) | **INT** 14 (+2) | **WIS** 11 (+0) | **CHA** 19 (+4)

**Saving Throws:** Dex +4, Con +9, Wis +4, Cha +8  
**Skills:** Perception +8, Stealth +4  
**Damage Immunities:** Fire  
**Senses:** Blindsight 30 ft., darkvision 120 ft., passive Perception 18  
**Languages:** Common, Draconic  
**Challenge:** 10 (5,900 XP)

### Actions
**Multiattack.** The dragon makes three attacks: one with its bite and two with its claws.

**Bite.** *Melee Weapon Attack:* +10 to hit, reach 10 ft., one target. *Hit:* 17 (2d10 + 6) piercing damage plus 3 (1d6) fire damage.

**Claw.** *Melee Weapon Attack:* +10 to hit, reach 5 ft., one target. *Hit:* 13 (2d6 + 6) slashing damage.

**Fire Breath (Recharge 5-6).** The dragon exhales fire in a 30-foot cone. Each creature in that area must make a DC 17 Dexterity saving throw, taking 56 (16d6) fire damage on a failed save, or half as much damage on a successful one.

---

## Drake
**Armor Class:** 14 (natural armor)  
**Hit Points:** 52 (8d8 + 16)  
**Speed:** 30 ft., fly 60 ft.

**STR** 16 (+3) | **DEX** 12 (+1) | **CON** 14 (+2) | **INT** 4 (-3) | **WIS** 10 (+0) | **CHA** 6 (-2)

**Skills:** Perception +2  
**Damage Resistances:** Fire  
**Senses:** Darkvision 60 ft., passive Perception 12  
**Languages:** Understands Draconic but can't speak  
**Challenge:** 2 (450 XP)

### Actions
**Bite.** *Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 10 (2d6 + 3) piercing damage.

**Tail.** *Melee Weapon Attack:* +5 to hit, reach 10 ft., one target. *Hit:* 7 (1d8 + 3) bludgeoning damage.

**Fire Breath (Recharge 5-6).** The drake exhales fire in a 15-foot cone. Each creature in that area must make a DC 12 Dexterity saving throw, taking 14 (4d6) fire damage on a failed save, or half as much damage on a successful one.`},lv={id:"humanoids",title:"Humanoid Foes",content:`# Humanoid Foes

Not all threats come from monsters. Bandits, cultists, and enemy soldiers pose significant dangers to adventurers.

---

## Bandit Captain
**Armor Class:** 15 (studded leather)  
**Hit Points:** 65 (10d8 + 20)  
**Speed:** 30 ft.

**STR** 15 (+2) | **DEX** 16 (+3) | **CON** 14 (+2) | **INT** 14 (+2) | **WIS** 11 (+0) | **CHA** 14 (+2)

**Saving Throws:** Str +4, Dex +5, Wis +2  
**Skills:** Athletics +4, Deception +4  
**Senses:** Passive Perception 10  
**Languages:** Common, Thieves' Cant  
**Challenge:** 2 (450 XP)

### Actions
**Multiattack.** The captain makes three melee attacks: two with its scimitar and one with its dagger.

**Scimitar.** *Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 6 (1d6 + 3) slashing damage.

**Dagger.** *Melee or Ranged Weapon Attack:* +5 to hit, reach 5 ft. or range 20/60 ft., one target. *Hit:* 5 (1d4 + 3) piercing damage.

### Reactions
**Parry.** The captain adds 2 to its AC against one melee attack that would hit it. To do so, the captain must see the attacker and be wielding a melee weapon.

---

## Cult Fanatic
**Armor Class:** 13 (leather armor)  
**Hit Points:** 33 (6d8 + 6)  
**Speed:** 30 ft.

**STR** 11 (+0) | **DEX** 14 (+2) | **CON** 12 (+1) | **INT** 10 (+0) | **WIS** 13 (+1) | **CHA** 14 (+2)

**Skills:** Deception +4, Persuasion +4, Religion +2  
**Senses:** Passive Perception 11  
**Languages:** Common  
**Challenge:** 2 (450 XP)

### Traits
**Dark Devotion.** The fanatic has advantage on saving throws against being charmed or frightened.

**Spellcasting.** The fanatic is a 4th-level spellcaster. Its spellcasting ability is Wisdom (spell save DC 11, +3 to hit with spell attacks). The fanatic has the following cleric spells prepared:
- Cantrips: *light*, *sacred flame*, *thaumaturgy*
- 1st level (4 slots): *command*, *inflict wounds*, *shield of faith*
- 2nd level (3 slots): *hold person*, *spiritual weapon*

### Actions
**Multiattack.** The fanatic makes two melee attacks.

**Dagger.** *Melee or Ranged Weapon Attack:* +4 to hit, reach 5 ft. or range 20/60 ft., one target. *Hit:* 4 (1d4 + 2) piercing damage.

---

## Orc Warrior
**Armor Class:** 13 (hide armor)  
**Hit Points:** 15 (2d8 + 6)  
**Speed:** 30 ft.

**STR** 16 (+3) | **DEX** 12 (+1) | **CON** 16 (+3) | **INT** 7 (-2) | **WIS** 11 (+0) | **CHA** 10 (+0)

**Skills:** Intimidation +2  
**Senses:** Darkvision 60 ft., passive Perception 10  
**Languages:** Common, Orc  
**Challenge:** 1/2 (100 XP)

### Traits
**Aggressive.** As a bonus action, the orc can move up to its speed toward a hostile creature that it can see.

### Actions
**Greataxe.** *Melee Weapon Attack:* +5 to hit, reach 5 ft., one target. *Hit:* 9 (1d12 + 3) slashing damage.

**Javelin.** *Melee or Ranged Weapon Attack:* +5 to hit, reach 5 ft. or range 30/120 ft., one target. *Hit:* 6 (1d6 + 3) piercing damage.`},av={id:"bestiary",title:"Bestiary",subtitle:"Creatures & Foes",icon:"🐉",content:`# Bestiary

The world teems with creatures both wondrous and terrifying. This bestiary catalogues the monsters, beasts, and adversaries that adventurers may encounter.

## Creature Types
- Undead: Risen from death
- Dragons: Ancient and powerful
